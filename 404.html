<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đang chuyển hướng...</title>
<script>
(function() {
  var p = location.pathname.toLowerCase();
  if (p.endsWith('/admin') || p.endsWith('/admin/')) {
    var base = location.pathname.replace(/\/admin\/?$/i, '');
    location.replace(base + '/quantri.html' + location.search + location.hash);
  } else {
    location.replace('./');
  }
})();
</script>
</head>
<body></body>
</html>
